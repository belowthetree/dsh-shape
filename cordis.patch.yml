# dsh-shape bundle: the shape surfaces and the Shape Studio agent preset.
#
# A bundle entry only applies this patch; it does not load the package itself,
# so the patch inserts both the plugin row and the preset row.
#
# Shape Studio reads and writes only the shapes directory: the preset mounts
# the shape tools (which include shape_read/shape_write scoped to that root)
# and the bundled shape-development skill, and no shell, filesystem, web, or
# plugin-installation row. Both preset-local plugins register in the preset
# scope, so other presets never see them.
- insert:
    - id: dsh-shape
      name: '@belowthetree/dsh-shape'
    - id: preset-shape
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: shape
        name: Shape Studio
        description: Read and write dsh-shape shapes inside the shapes directory, with preset-scoped shape tools and the shape-development skill.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a dsh-shape developer powered by the {{model}} model.

                This preset can only reach the shapes directory.
                It has no shell, no general file read/write, no network, and no
                plugin installation, so those tools were removed on purpose
                rather than being broken. Read and write shape files only with
                shape_read, shape_write, shape_tree, and shape_grep, which take
                a shape id and a path relative to that shape folder. When a task
                needs anything outside a shape — running a command, editing the
                plugin package, installing a dependency, editing a preset —
                explain that this preset cannot do it and name the limitation
                instead of trying another tool.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: shape-tools
            name: '@belowthetree/dsh-shape/tools'
          - id: shape-skill
            name: '@belowthetree/dsh-shape/skill'
