<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greeting Shape</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #08130f;
      color: #dff8ed;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    main {
      width: min(460px, calc(100vw - 48px));
      padding: 28px;
      border: 1px solid rgba(125, 240, 194, 0.24);
      border-radius: 16px;
      background: rgba(12, 31, 24, 0.8);
    }
    p { color: #9cc9b7; line-height: 1.6; }
    button {
      padding: 8px 14px;
      color: #08130f;
      font: inherit;
      font-weight: 600;
      background: #7df0c2;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #greeting { min-height: 24px; color: #b9ffe3; }
  </style>
</head>
<body>
  <main>
    <h1>Greeting Shape</h1>
    <p>这是 <code>shapes/greeting/views/index.html</code>。同一个 shape 还会把一张卡片注入到聊天输入区上方。</p>
    <button id="hello" type="button">打个招呼</button>
    <p id="greeting" role="status"></p>
  </main>
  <script>
    document.querySelector('#hello').addEventListener('click', () => {
      document.querySelector('#greeting').textContent = '你好！👋 这是 Greeting Shape 的问候。'
    })
  </script>
</body>
</html>
