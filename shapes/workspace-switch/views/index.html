<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workspace Switch</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #08130f;
      color: #dff8ed;
      font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    main {
      width: min(520px, calc(100vw - 48px));
      padding: 28px;
      border: 1px solid rgba(125, 240, 194, 0.24);
      border-radius: 16px;
      background: rgba(12, 31, 24, 0.8);
    }
    p { color: #9cc9b7; line-height: 1.6; }
    kbd {
      padding: 2px 6px;
      color: #08130f;
      background: #7df0c2;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Workspace Switch</h1>
    <p>这个 shape 的 <code>client/index.js</code> 通过内置的 <code>dsh-shape#workspace</code> 能力注册快捷键。</p>
    <p><kbd>Ctrl + Alt + →</kbd> 下一个工作区</p>
    <p><kbd>Ctrl + Alt + ←</kbd> 上一个工作区</p>
    <p>切换时会打开目标工作区最近的会话；没有会话时打开该工作区的空白会话。</p>
  </main>
</body>
</html>
